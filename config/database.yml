# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production databases in the storage/ directory by default, mounted as a
# persistent Docker volume in config/deploy.yml. Override paths with environment
# variables when the deploy target requires a different mounted location.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_PATH", "storage/production.sqlite3") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("CACHE_DATABASE_PATH", "storage/production_cache.sqlite3") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("QUEUE_DATABASE_PATH", "storage/production_queue.sqlite3") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("CABLE_DATABASE_PATH", "storage/production_cable.sqlite3") %>
    migrations_paths: db/cable_migrate
